zotero:
  user_id: ??? # User ID of your Zotero account.
  api_key: ??? # An Zotero API key with read access.
  include_path: null # A glob pattern marking the Zotero collections that should be included. Example: "2026/survey/**"
  api_max_retries: 5 # Number of retries for transient Zotero API 429/5xx failures. Example: 5
  api_retry_delay_seconds: 30 # Delay between Zotero API retries in seconds. Example: 30

source:
  arxiv:
    category: null # The categories of target arxiv papers. Find the abbr of your research area from [here](https://arxiv.org/category_taxonomy). Example: ["cs.AI","cs.CV","cs.LG","cs.CL"]
    api_enrich_metadata: false # Whether to call export.arxiv.org/api/query after RSS retrieval. Keep false for stable GitHub Actions runs.
    api_batch_size: 5 # Number of paper IDs to request from the arXiv API at once. Smaller values reduce HTTP 429 risk. Example: 5
    api_delay_seconds: 15 # Delay between arXiv API retries in seconds. Larger values reduce HTTP 429 risk. Example: 15
    api_num_retries: 3 # Number of retries for transient arXiv API failures. Example: 3
  biorxiv:
    category: null # The categories of target biorxiv papers. Find categories from [here](https://www.biorxiv.org/). Example: ["biochemistry","animal behavior and cognition"]
  medrxiv:
    category: null # The categories of target medrxiv papers. Find categories from [here](https://www.medrxiv.org/) Example: ["psychiatry and clinical psychology", "neurology"]
  top_venue:
    venues: # Target conferences and journals monitored through OpenAlex metadata.
      - International Conference on Learning Representations
      - International Conference on Machine Learning
      - Neural Information Processing Systems
      - Network and Distributed System Security Symposium
      - USENIX Security Symposium
      - IEEE Symposium on Security and Privacy
      - ACM Conference on Computer and Communications Security
      - IEEE Transactions on Information Forensics and Security
      - IEEE Transactions on Dependable and Secure Computing
      - IEEE Transactions on Pattern Analysis and Machine Intelligence
      - Journal of Machine Learning Research
      - Artificial Intelligence
      - Nature
      - Science
    model_keywords: ["large language model", "llm", "language model", "foundation model", "agent", "multi-agent", "diffusion model", "text-to-image"]
    security_keywords: ["privacy", "private", "permission", "access control", "authorization", "authentication", "confidentiality", "data leakage", "information leakage", "security", "secure", "safety", "jailbreak"]
    lookback_days: 21 # Only retrieve papers published in the last N days. Increase for annual conference release checks. Example: 30
    per_page: 200 # Maximum OpenAlex results per venue query. Example: 200
    request_delay_seconds: 0.2 # Delay between OpenAlex venue queries. Example: 0.2
    mailto: null # Optional contact email for OpenAlex polite pool. Example: abc@example.com

email:
  sender: ??? # The email account of the SMTP server that sends you email. Example: abc@qq.com
  receiver: ??? # The email account that receives the paper list. Example: abc@outlook.com
  smtp_server: ??? # The SMTP server that sends the email. Ask your email provider (Gmail, QQ, Outlook, ...) for its SMTP server. Example: smtp.qq.com
  smtp_port: ??? # The port of SMTP server. Example: 465
  sender_password: ??? # The password of the sender account. Note that it's not necessarily the password for logging in the e-mail client, but the authentication code for SMTP service. Ask your email provider for this. Example: abcdefghijklmn
  api_balance:
    enabled: false # Whether to append API balance information to the email footer. Example: true
    endpoint: null # HTTP GET endpoint returning balance JSON from your API provider. Example: https://api.example.com/v1/user/balance
    api_key: ${oc.env:OPENAI_API_KEY,null} # API key used for the balance endpoint. Example: sk-xxx
    header_name: Authorization # Header used for the API key. Example: Authorization
    header_prefix: "Bearer " # Prefix before the API key. Use "" if the endpoint expects the raw key.
    json_path: null # Dot path to the balance field in the JSON response. Example: data.balance
    currency: "" # Optional display suffix. Example: USD

llm:
  api:
    key: ??? # API Key of your LLM API. Example: sk-xxx
    base_url: ??? # API URL of your LLM API. Example: https://api.openai.com/v1
    timeout: 120 # Timeout in seconds for each LLM API request. Example: 120
    max_retries: 3 # Number of retries for transient LLM API failures. Example: 3
  generation_kwargs:
  # Arguments for the LLM API. See [here](https://platform.openai.com/docs/api-reference/chat/create) for more details.
    max_tokens: 16384
    model: ??? # A model name or an ordered list of model names. If a list is provided, the first successful model is used.
  language: Chinese # Preferred language for generated summaries and reviews. Example: Chinese

reranker:
  local:
    model: jinaai/jina-embeddings-v5-text-nano # The Hugging Face model name of the local embedding model. Example: jinaai/jina-embeddings-v5-text-nano
    encode_kwargs:
    # The kwargs for the encode method of the local embedding model. Details see [here](https://www.sbert.net/docs/package_reference/SentenceTransformer.html#sentence_transformers.SentenceTransformer.encode)
      task: retrieval
      prompt_name: document
  api:
    key: null # API Key of your embedding model API. Example: sk-xxx
    base_url: null # API URL of your embedding model API. Example: https://api.openai.com/v1
    model: null # The model name of the embedding model. Example: text-embedding-3-large
    timeout: 120 # Timeout in seconds for each embedding API request. Example: 120
    max_retries: 3 # Number of retries for transient embedding API failures. Example: 3

quality_filter:
  enabled: true # Whether to use LLM review to filter papers by research quality. Example: true
  min_score: 7.0 # Minimum overall quality score required for email delivery. Example: 7.0
  candidate_multiplier: 3 # Review this many times max_paper_num after relevance reranking. Example: 3

executor:
  debug: false # Whether to use debug mode. Example: true
  send_empty: false # Whether to send an empty email even if no new papers today. Example: true
  max_workers: 4 # Concurrent workers for processing papers. Example: 4
  max_paper_num: 25 # The maximum number of the papers presented in the email. Example: 25
  extract_selected_full_text: true # Whether to download selected paper PDFs before TLDR and affiliation extraction. Example: true
  source: ??? # The sources of papers to retrieve. Example: ['arxiv','biorxiv','medrxiv']
  reranker: local # The reranker to use. Example: 'local' or 'api'
