name: Process emailed paper lists

on:
  workflow_dispatch:
    inputs:
      reprocess_latest:
        description: Reprocess the newest matching request even if it is already read
        required: false
        default: false
        type: boolean
  schedule:
    # Avoid the top of the hour, when scheduled Actions are more likely to queue.
    - cron: '7/10 * * * *'

concurrency:
  group: emailed-paper-lists
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-one-email:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY || github.repository }}
          ref: ${{ vars.REF || github.ref_name }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Check mailbox and process one request
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_PORT: ${{ vars.IMAP_PORT || '993' }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          ALLOWED_SENDER: ${{ secrets.ALLOWED_SENDER }}
          REPROCESS_LATEST: ${{ inputs.reprocess_latest || 'false' }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run src/zotero_arxiv_daily/request_main.py llm.language=Chinese
