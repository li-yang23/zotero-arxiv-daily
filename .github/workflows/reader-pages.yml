name: Publish paper reader
on:
  push:
    branches: [main]
    paths: ['reader-pages/**', 'scripts/build_reader_library.py', 'scripts/check_reader_publish.py', '.github/workflows/reader-pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Read selected papers', 'Send emails daily']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  continue-reader:
    # Completion events survive worker errors/timeouts. Do not put this job in
    # the Pages concurrency group: a newer deploy could replace a pending one.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Read selected papers' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      !contains(fromJSON('["cancelled", "skipped", "neutral"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: reader-completion-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Recover interrupted work and trigger the next queued paper
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/finish_reader_run.py
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          ref: reader-data
          path: reader-data
      - name: Skip publication when the public library has not changed
        id: changes
        env:
          REPOSITORY: ${{ github.repository }}
          PAPER_READER_URL: ${{ vars.PAPER_READER_URL }}
          FORCE_PUBLISH: ${{ github.event_name != 'workflow_run' }}
        run: python scripts/check_reader_publish.py reader-data/state.json
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: reader-pages/package-lock.json
      - name: Prepare public library
        if: steps.changes.outputs.changed == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
        run: python scripts/build_reader_library.py reader-data/state.json reader-pages/public/data/library.json "$REPOSITORY"
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.changed == 'true'
        id: pages
      - name: Build static reader
        if: steps.changes.outputs.changed == 'true'
        working-directory: reader-pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-pages-artifact@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          path: reader-pages/dist
      - uses: actions/deploy-pages@v4
        if: steps.changes.outputs.changed == 'true'
        id: deployment
