name: Read selected papers
on:
  workflow_dispatch:
    inputs:
      request:
        description: Optional paper request JSON copied from the reader
        type: string
        required: false
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
  issues: read
concurrency:
  group: paper-reader
  cancel-in-progress: false
jobs:
  read:
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Paper Reader]')) ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_READER_URL: ${{ vars.PAPER_READER_URL }}
      GH_TOKEN: ${{ github.token }}
      PAPER_READER_JOB: .reader-job.json
    steps:
      - uses: actions/checkout@v6
      - name: Check for selected papers without installing ML dependencies
        id: queue
        run: python scripts/claim_reader_job.py
      - uses: astral-sh/setup-uv@v7
        if: steps.queue.outputs.pending == 'true'
      - name: Read queued papers
        if: steps.queue.outputs.pending == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          RECEIVER: ${{ secrets.RECEIVER }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf '%s\n' "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          uv run python -m zotero_arxiv_daily.reader_main
