name: Read selected papers
on:
  workflow_dispatch:
    inputs:
      request:
        description: Optional paper request JSON copied from the reader
        type: string
        required: false
      continuation:
        description: Internal continuation after a completed reading run
        type: boolean
        default: false
  issues:
    types: [opened, reopened, edited]
permissions:
  contents: write
  issues: read
concurrency:
  group: paper-reader
  cancel-in-progress: false
jobs:
  read:
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Paper Reader]')) ||
      (github.event_name == 'workflow_dispatch' && (github.actor == github.repository_owner ||
        (github.actor == 'github-actions[bot]' && inputs.continuation && !inputs.request)))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_READER_URL: ${{ vars.PAPER_READER_URL }}
      GH_TOKEN: ${{ github.token }}
      PAPER_READER_JOB: .reader-job.json
    steps:
      - uses: actions/checkout@v6
      - name: Check for selected papers without installing ML dependencies
        id: queue
        run: python scripts/claim_reader_job.py
      - uses: astral-sh/setup-uv@v7
        if: steps.queue.outputs.pending == 'true'
      - name: Read queued papers
        if: steps.queue.outputs.pending == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          RECEIVER: ${{ secrets.RECEIVER }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf '%s\n' "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          uv run python -m zotero_arxiv_daily.reader_main

  continue-and-publish:
    # A job dependency runs for owner and bot dispatches alike. Do not rely on
    # workflow_run: GitHub suppresses it after GITHUB_TOKEN-dispatched runs.
    needs: read
    if: ${{ always() && !cancelled() && needs.read.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Recover interrupted work, publish results and trigger the next paper
        env:
          GH_TOKEN: ${{ github.token }}
          READER_CONCLUSION: ${{ needs.read.result }}
          READER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/finish_reader_run.py
