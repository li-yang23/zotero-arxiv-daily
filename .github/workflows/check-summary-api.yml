name: Check summary API
on:
  workflow_dispatch:
    inputs:
      model:
        description: Configured summary model to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check one small completion without sending email
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CHECK_MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          request = urllib.request.Request(
              os.environ['OPENAI_API_BASE'].rstrip('/') + '/chat/completions',
              data=json.dumps({
                  'model': os.environ['CHECK_MODEL'],
                  'messages': [{'role': 'user', 'content': 'Return only a JSON object with a single field: {"status":"OK"}.'}],
                  'response_format': {'type': 'json_object'},
                  'stream': True,
                  'max_tokens': 256,
              }).encode(),
              headers={
                  'Authorization': 'Bearer ' + os.environ['OPENAI_API_KEY'],
                  'Content-Type': 'application/json',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  print('Summary API HTTP status:', response.status)
                  chunks = []
                  finish = None
                  for line in response:
                      if not line.startswith(b'data: '): continue
                      data = line[6:].strip()
                      if data == b'[DONE]': break
                      event = json.loads(data)
                      for choice in event.get('choices') or []:
                          chunks.append(choice.get('delta', {}).get('content') or '')
                          finish = choice.get('finish_reason') or finish
                  content = ''.join(chunks)
                  print('Finish reason:', finish)
                  print('Content characters:', len(content))
                  parsed = json.loads(content)
                  if parsed.get('status') != 'OK':
                      raise ValueError('Structured completion did not match the requested object')
                  print('Structured completion validated.')
          except urllib.error.HTTPError as exc:
              body = json.loads(exc.read())
              print('Summary API HTTP status:', exc.code)
              print('Provider message:', body.get('message') or body.get('error', {}).get('message'))
              raise SystemExit(1)
          except Exception as exc:
              print('Summary API connection failed:', type(exc).__name__)
              raise SystemExit(1)
          PY
