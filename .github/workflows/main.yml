name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          API_BALANCE_ENABLED: ${{ vars.API_BALANCE_ENABLED }}
          API_BALANCE_ENDPOINT: ${{ secrets.API_BALANCE_ENDPOINT }}
          API_BALANCE_JSON_PATH: ${{ vars.API_BALANCE_JSON_PATH }}
          API_BALANCE_CURRENCY: ${{ vars.API_BALANCE_CURRENCY }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py llm.language=Chinese executor.max_paper_num=25
